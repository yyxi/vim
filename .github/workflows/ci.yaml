name: ci
on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
env:
  NEOVIM_VERSION: v0.12.2
  TREE_SITTER_VERSION: v0.26.1
  STYLUA_VERSION: v2.5.2
  LUA_LANGUAGE_SERVER_VERSION: 3.18.2

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - name: restore managed vendor cache
        id: vendor-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            vendor/git/repositories
            vendor/git/worktrees
            vendor/treesitter
          key: managed-vendor-${{ runner.os }}-${{ runner.arch }}-${{ env.TREE_SITTER_VERSION }}-${{ hashFiles('source-manifest.json', 'manage') }}
      - name: install the latest version of uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            **/pyproject.toml
          enable-cache: true
          ignore-nothing-to-cache: true
          version: 'latest'
      - name: install node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
          run_install: false
      - name: dependencies
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y unzip
          elif [ "$RUNNER_OS" != "macOS" ]; then
            echo "unsupported runner OS: $RUNNER_OS" >&2
            exit 1
          fi

          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64)
              nvim_archive='nvim-linux-x86_64.tar.gz'
              tree_sitter_archive='tree-sitter-linux-x64.gz'
              stylua_archive='stylua-linux-x86_64.zip'
              lua_ls_archive="lua-language-server-${LUA_LANGUAGE_SERVER_VERSION}-linux-x64.tar.gz"
              ;;
            Linux/ARM64)
              nvim_archive='nvim-linux-arm64.tar.gz'
              tree_sitter_archive='tree-sitter-linux-arm64.gz'
              stylua_archive='stylua-linux-aarch64.zip'
              lua_ls_archive="lua-language-server-${LUA_LANGUAGE_SERVER_VERSION}-linux-arm64.tar.gz"
              ;;
            macOS/X64)
              nvim_archive='nvim-macos-x86_64.tar.gz'
              tree_sitter_archive='tree-sitter-macos-x64.gz'
              stylua_archive='stylua-macos-x86_64.zip'
              lua_ls_archive="lua-language-server-${LUA_LANGUAGE_SERVER_VERSION}-darwin-x64.tar.gz"
              ;;
            macOS/ARM64)
              nvim_archive='nvim-macos-arm64.tar.gz'
              tree_sitter_archive='tree-sitter-macos-arm64.gz'
              stylua_archive='stylua-macos-aarch64.zip'
              lua_ls_archive="lua-language-server-${LUA_LANGUAGE_SERVER_VERSION}-darwin-arm64.tar.gz"
              ;;
            *)
              echo "unsupported runner platform: ${RUNNER_OS}/${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac

          rm -rf "$HOME/.neovim-dist"
          mkdir -p "$HOME/.neovim-dist"
          curl -fsSL -o nvim.tar.gz "https://github.com/neovim/neovim/releases/download/${NEOVIM_VERSION}/${nvim_archive}"
          tar xzf nvim.tar.gz --strip-components=1 -C "$HOME/.neovim-dist"
          rm -f nvim.tar.gz
          ln -sf "$HOME/.neovim-dist/bin/nvim" "$HOME/.local/bin/nvim"

          curl -fsSL -o tree-sitter.gz "https://github.com/tree-sitter/tree-sitter/releases/download/${TREE_SITTER_VERSION}/${tree_sitter_archive}"
          gzip -d -c tree-sitter.gz > "$HOME/.local/bin/tree-sitter"
          rm -f tree-sitter.gz
          chmod +x "$HOME/.local/bin/tree-sitter"

          curl -fsSL -o stylua.zip "https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/${stylua_archive}"
          unzip -q -o stylua.zip -d "$HOME/.local/bin"
          rm -f stylua.zip
          chmod +x "$HOME/.local/bin/stylua"

          rm -rf "$HOME/.local/share/lua-language-server"
          mkdir -p "$HOME/.local/share/lua-language-server"
          curl -fsSL -o lua-language-server.tar.gz "https://github.com/LuaLS/lua-language-server/releases/download/${LUA_LANGUAGE_SERVER_VERSION}/${lua_ls_archive}"
          tar xzf lua-language-server.tar.gz -C "$HOME/.local/share/lua-language-server"
          rm -f lua-language-server.tar.gz
          ln -sf "$HOME/.local/share/lua-language-server/bin/lua-language-server" "$HOME/.local/bin/lua-language-server"

          uv sync --locked
      - name: install
        run: |
          ln -s "$(pwd)" ~/.vim
          if [ "${{ steps.vendor-cache-restore.outputs.cache-hit }}" = "true" ]; then
            ~/.vim/manage install --offline
          else
            ~/.vim/manage install
          fi
      - name: check
        run: |
          ~/.vim/manage check
      - name: scan
        run: |
          ~/.vim/manage scan
      - name: save managed vendor cache
        if: success() && steps.vendor-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            vendor/git/repositories
            vendor/git/worktrees
            vendor/treesitter
          key: managed-vendor-${{ runner.os }}-${{ runner.arch }}-${{ env.TREE_SITTER_VERSION }}-${{ hashFiles('source-manifest.json', 'manage') }}

  continuous-integration:
    if: ${{ always() }}
    needs:
      - checks
    runs-on: ubuntu-latest
    steps:
      - name: fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - name: pass if all required jobs succeeded
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) }}
        run: exit 0
