name: ci
on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
env:
  TREE_SITTER_VERSION: v0.26.1

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    # name: continuous-integration-${{ matrix.os }}
    # runs-on: ${{ matrix.os }}
    # strategy:
    #   matrix:
    #     # os: [macos-latest, ubuntu-latest]
    #     os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - name: restore managed vendor cache
        id: vendor-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            vendor/git/repositories
            vendor/git/worktrees
            vendor/treesitter
          key: managed-vendor-${{ runner.os }}-${{ runner.arch }}-${{ env.TREE_SITTER_VERSION }}-${{ hashFiles('source-manifest.json', 'manage') }}
      - name: install the latest version of uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            **/pyproject.toml
          enable-cache: true
          ignore-nothing-to-cache: true
          version: 'latest'
      - name: install node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
          run_install: false
      - name: dependencies
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y zsh bc unzip

            mkdir -p "$HOME/.neovim-dist"
            curl -fsSL -o nvim-linux-x86_64.tar.gz https://github.com/neovim/neovim/releases/download/v0.12.2/nvim-linux-x86_64.tar.gz
            tar xzf nvim-linux-x86_64.tar.gz --strip-components=1 -C "$HOME/.neovim-dist"
            rm -f nvim-linux-x86_64.tar.gz

            curl -fsSL -o tree-sitter.gz "https://github.com/tree-sitter/tree-sitter/releases/download/${TREE_SITTER_VERSION}/tree-sitter-linux-x64.gz"
            gzip -d tree-sitter.gz
            mv tree-sitter "$HOME/.local/bin/tree-sitter"
            chmod +x "$HOME/.local/bin/tree-sitter"

            stylua_version=v2.5.2
            curl -fsSL -o stylua.zip "https://github.com/JohnnyMorganz/StyLua/releases/download/${stylua_version}/stylua-linux-x86_64.zip"
            unzip -q stylua.zip -d "$HOME/.local/bin"
            rm -f stylua.zip
            chmod +x "$HOME/.local/bin/stylua"

            lua_ls_version=3.18.2
            mkdir -p "$HOME/.local/share/lua-language-server"
            curl -fsSL -o lua-language-server.tar.gz "https://github.com/LuaLS/lua-language-server/releases/download/${lua_ls_version}/lua-language-server-${lua_ls_version}-linux-x64.tar.gz"
            tar xzf lua-language-server.tar.gz -C "$HOME/.local/share/lua-language-server"
            rm -f lua-language-server.tar.gz
            ln -sf "$HOME/.local/share/lua-language-server/bin/lua-language-server" "$HOME/.local/bin/lua-language-server"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install bash zsh bc gnu-sed stylua lua-language-server
            brew install neovim --HEAD
            # mkdir -p "$HOME/.neovim-dist"
            # curl -sLO https://github.com/neovim/neovim/releases/download/nightly/nvim-macos.tar.gz
            # xattr -c nvim-macos.tar.gz
            # tar xzvf nvim-macos.tar.gz --strip-components=1 -C "$HOME/.neovim-dist"
            # rm -f nvim-macos.tar.gz
          fi

          uv sync --locked
      - name: install
        run: |
          ln -s "$(pwd)" ~/.vim
          if [ "${{ steps.vendor-cache-restore.outputs.cache-hit }}" = "true" ]; then
            ~/.vim/manage install --offline
          else
            ~/.vim/manage install
          fi
      - name: check
        run: |
          ~/.vim/manage check
      - name: scan
        run: |
          ~/.vim/manage scan
      - name: save managed vendor cache
        if: success() && steps.vendor-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            vendor/git/repositories
            vendor/git/worktrees
            vendor/treesitter
          key: managed-vendor-${{ runner.os }}-${{ runner.arch }}-${{ env.TREE_SITTER_VERSION }}-${{ hashFiles('source-manifest.json', 'manage') }}
