version: 2

updates:
  - cooldown:
      default-days: 7
      include:
        - '*'
    directory: '/'
    ignore:
      # pnpm/action-setup 6.1.0 bootstraps pnpm 11.25.0, whose engine identity
      # check fails on Intel macOS (fixed in pnpm 11.26.0). Lift once the action's
      # bootstrap moves to pnpm >= 11.26.0. See AGENTS.md.
      - dependency-name: 'pnpm/action-setup'
        versions: ['>= 6.1.0']
    groups:
      actions:
        update-types:
          - 'minor'
          - 'patch'
    labels: []
    open-pull-requests-limit: 5
    package-ecosystem: 'github-actions'
    schedule:
      day: monday
      interval: weekly
      time: '07:00'
      timezone: Etc/UTC
